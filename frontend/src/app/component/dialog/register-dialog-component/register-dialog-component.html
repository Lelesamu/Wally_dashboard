<!--
    This example requires updating your template:

    ```
    <html class="h-full bg-white">
    <body class="h-full">
    ```
-->
<div class="flex min-h-full flex-col justify-center px-6 ">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <!-- <form action="#" method="POST" class="space-y-6"> -->
        <form class="space-y-6">
            <div>
                <label 
                    for="username" 
                    class="block text-sm/6 font-medium text-gray-900">
                    Username
                </label>
                <div class="mt-2">
                    <input 
                    [(ngModel)]="username"
                    id="username" 
                    type="text" 
                    name="username" 
                    required 
                    autocomplete="username" 
                    class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-orange-600 sm:text-sm/6" 
                />
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between">
                    <label 
                        for="password" 
                        class="block text-sm/6 font-medium text-gray-900">
                        Password
                    </label>  
                </div>
                <div class="mt-2">
                    <input 
                    [(ngModel)]="password"
                        id="password" 
                        type="password"
                        name="password" 
                        required 
                        autocomplete="current-password" 
                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-orange-600 sm:text-sm/6" 
                    />
                </div>
            </div>

            <div>
                <button 
                    (click)="register()"
                    type="button"
                    class="flex w-full justify-center rounded-md bg-orange-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-orange-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600">
                    Register
                </button>
            </div>
        </form>
    </div>
</div>
